<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>shorter</title>
    <meta name="description" content="a domain shortener tool" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link href="style.css" rel="stylesheet" />
    <script src="htmx.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header class="landing">
        <a href="/">
          <img src="logomark.svg" alt="shorter" />
        </a>
        <details>
          <summary><img src="menu.svg" alt="menu" /></summary>
          <nav>
            <a
              href="https://www.dynadot.com/domain/search?rscreg=shorter"
              class="link"
            >
              dynadot
            </a>
            <a href="https://github.com/niklasanesen/shorter" class="link">
              repo
            </a>
            <a href="mailto:contact@shorter.dev" class="link"> contact </a>
            <a href="#q" class="btn btn-primary">start now</a>
          </nav>
        </details>
      </header>
      <main>
        <div class="hero">
          <h1 class="landing">search for shorter domains</h1>
          <input
            id="q"
            name="q"
            hx-get="http://127.0.0.1:8080/search"
            hx-trigger="input changed delay:200ms"
            hx-target="#search-results"
            placeholder="type a domain..."
            oninput="if (location.hash !== '#q') location.hash = 'q';"
            autofocus
            autocomplete="off"
          />
          <div id="search-results" class="search"></div>
          <div class="landing examples">
            <a href="#q" class="link" onclick="example('naval')">naval</a>
            <a href="#q" class="link" onclick="example('linktree')">linktree</a>
            <a href="#q" class="link" onclick="example('google')">google</a>
            <a href="#q" class="link" onclick="example('matt')">matt</a>
            <a href="#q" class="link" onclick="example('instagram')">
              instagram
            </a>
          </div>
        </div>
      </main>
    </div>
    <script>
      function example(q) {
        const input = document.getElementById("q");
        input.value = q;
        htmx.trigger(input, "input");
      }
    </script>
  </body>
</html>
