<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>shorter</title>
    <meta name="description" content="a domain shortener tool" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link href="style.css" rel="stylesheet" />
    <script src="htmx.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <a href="/">
          <img src="logomark.svg" alt="shorter" />
        </a>
        <details>
          <summary><img src="menu.svg" alt="menu" /></summary>
          <nav>
            <a
              href="https://www.dynadot.com/domain/search?rscreg=shorter"
              class="link"
            >
              dynadot
            </a>
            <a href="https://github.com/niklasanesen/shorter" class="link">
              repo
            </a>
            <a href="mailto:contact@shorter.dev" class="link"> contact </a>
            <a href="#search" class="btn btn-primary">start now</a>
          </nav>
        </details>
      </header>
      <main>
        <input
          name="q"
          hx-get="http://127.0.0.1:8080/search"
          hx-trigger="input changed delay:200ms"
          hx-target="#search-results"
          placeholder="type a domain..."
        />
        <div id="search-results"></div>
      </main>
    </div>
  </body>
</html>
